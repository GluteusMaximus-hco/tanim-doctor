<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Tanim Doctor{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
// set the theme BEFORE the page paints, otherwise you get a white flash
// on dark mode which looks awful. reads what the user picked last time.
(function(){
  try{
    var t = localStorage.getItem('tanim-theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
</head>
<body>
<nav><div class="wrap">
  <a href="{{ url_for('index') }}" class="logo">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 21V9.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M12 12.5c0-3.3 2.6-6 6.5-6.4.3 3.9-2.2 6.8-6.5 6.4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M12 16.5c0-2.8-2.2-5.1-5.5-5.4-.3 3.3 1.9 5.8 5.5 5.4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </span><span class="t1">Tanim</span><span class="t2">Doctor</span>
  </a>
  <div class="nav-links">
    {% if me %}
      <a href="{{ url_for('history') }}">My scans</a>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Sign up</a>
    {% endif %}
    <button class="theme-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.6 8.6 0 1 0 10.2 10.2Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div></nav>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}
  <div class="toast-wrap" id="toasts">
    {% for cat,m in msgs %}
      <div class="flash {{ cat }}">
        <span class="msg">{{ m }}</span>
        <button class="x" aria-label="Dismiss">&times;</button>
      </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
<main><div class="wrap">{% block body %}{% endblock %}</div></main>

<script>
// theme toggle. if you've never picked one we just follow your system setting.
(function(){
  var btn = document.getElementById('themeBtn');
  var root = document.documentElement;

  function currentlyDark(){
    var set = root.getAttribute('data-theme');
    if(set) return set === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintIcon(){ btn.classList.toggle('is-dark', currentlyDark()); }

  btn.addEventListener('click', function(){
    var next = currentlyDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('tanim-theme', next); }catch(e){}
    paintIcon();
  });
  paintIcon();
})();

// toasts: click the x to kill one, and they auto-dismiss after 5s so they
// don't just sit there forever blocking the corner
(function(){
  var wrap = document.getElementById('toasts');
  if(!wrap) return;

  function dismiss(el){
    if(el.classList.contains('leaving')) return;
    el.classList.add('leaving');
    setTimeout(function(){ el.remove(); }, 260);
  }

  wrap.querySelectorAll('.flash').forEach(function(t){
    t.querySelector('.x').addEventListener('click', function(){ dismiss(t); });
    var timer = setTimeout(function(){ dismiss(t); }, 5000);
    // hovering pauses the auto-dismiss, in case you're still reading it
    t.addEventListener('mouseenter', function(){ clearTimeout(timer); });
  });
})();
</script>
</body>
</html>
