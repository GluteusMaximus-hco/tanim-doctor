<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Tanim Doctor{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
// set the theme BEFORE the page paints, otherwise you get a white flash
// on dark mode which looks awful. reads what the user picked last time.
(function(){
  try{
    var t = localStorage.getItem('tanim-theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
</head>
<body>
<nav><div class="wrap">
  <a href="{{ url_for('index') }}" class="logo">
    <span class="mark">🌿</span><span class="t1">Tanim</span><span class="t2">Doctor</span>
  </a>
  <div class="nav-links">
    {% if me %}
      <a href="{{ url_for('history') }}">My scans</a>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% else %}
      <a href="{{ url_for('login') }}">Log in</a>
      <a href="{{ url_for('register') }}">Sign up</a>
    {% endif %}
    <button class="theme-btn" id="themeBtn" title="Switch theme" aria-label="Switch theme">🌙</button>
  </div>
</div></nav>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}
  <div class="toast-wrap" id="toasts">
    {% for cat,m in msgs %}
      <div class="flash {{ cat }}">
        <span class="msg">{{ m }}</span>
        <button class="x" aria-label="Dismiss">&times;</button>
      </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
<main><div class="wrap">{% block body %}{% endblock %}</div></main>

<script>
// theme toggle. if you've never picked one we just follow your system setting.
(function(){
  var btn = document.getElementById('themeBtn');
  var root = document.documentElement;

  function currentlyDark(){
    var set = root.getAttribute('data-theme');
    if(set) return set === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function paintIcon(){ btn.textContent = currentlyDark() ? '☀️' : '🌙'; }

  btn.addEventListener('click', function(){
    var next = currentlyDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('tanim-theme', next); }catch(e){}
    paintIcon();
  });
  paintIcon();
})();

// toasts: click the x to kill one, and they auto-dismiss after 5s so they
// don't just sit there forever blocking the corner
(function(){
  var wrap = document.getElementById('toasts');
  if(!wrap) return;

  function dismiss(el){
    if(el.classList.contains('leaving')) return;
    el.classList.add('leaving');
    setTimeout(function(){ el.remove(); }, 260);
  }

  wrap.querySelectorAll('.flash').forEach(function(t){
    t.querySelector('.x').addEventListener('click', function(){ dismiss(t); });
    var timer = setTimeout(function(){ dismiss(t); }, 5000);
    // hovering pauses the auto-dismiss, in case you're still reading it
    t.addEventListener('mouseenter', function(){ clearTimeout(timer); });
  });
})();
</script>
</body>
</html>
